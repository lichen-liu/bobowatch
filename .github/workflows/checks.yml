name: Python checks

on:
  pull_request:
    types: [labeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  tests:
    name: unittest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            requirements-dev.txt
      - name: Install development requirements
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check bobowatch tests examples installation deployment
      - name: Check formatting
        run: ruff format --check bobowatch tests examples installation deployment
      - name: Test
        run: python -Werror::ResourceWarning -m unittest discover -s tests -v

      - name: Calendar range and daylight-saving tests
        run: node --test tests/test_calendar_ranges.cjs
