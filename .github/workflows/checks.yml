name: Python checks

on:
  pull_request:
    types: [labeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  tests:
    name: unittest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            requirements-dev.txt
      - name: Install development requirements
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check bobowatch tests examples installation deployment
      - name: Check formatting
        run: ruff format --check bobowatch tests examples installation deployment
      - name: Test
        run: python -Werror::ResourceWarning -m unittest discover -s tests -v

      - name: Dashboard logic and daylight-saving tests
        run: node --test tests/test_*.cjs

  browser:
    name: Dashboard browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-core.txt
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - name: Install core server and development-only browser dependencies
        run: |
          python -m pip install -r requirements-core.txt
          npm ci --prefix tests/browser --ignore-scripts --no-audit --no-fund
          tests/browser/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Check chart interaction in isolated fictional pages
        run: node tests/browser/charts.cjs
      - name: Check dashboard workflows against an ephemeral fictional runtime
        run: python tests/browser/run.py
